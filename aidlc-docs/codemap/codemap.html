<style>

    font-size:8.5px; letter-spacing:.14em; text-transform:uppercase;

  .stat .v{font-size:12px; color:var(--ink); white-space:nowrap; font-variant-numeric:tabular-nums}

  .controls{margin-left:auto; display:flex; align-items:center; gap:6px; padding:0 12px}
  button{
    font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink); background:transparent; border:1px solid var(--rule);

  button:hover{border-color:var(--blue); color:var(--blue-soft)}
  button:focus-visible{outline:2px solid var(--orange); outline-offset:1px}

  /* ---------- three columns ---------- */
  .body{display:flex; flex:1; min-height:0}

  .index{

  }
  .grp{
    font-size:8.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--faint); padding:12px 12px 5px;
  }
  .row{
    display:flex; gap:8px; align-items:baseline; width:100%;

    font-family:var(--mono); font-size:10.5px; letter-spacing:.02em;

  .row[aria-current="true"]{color:var(--ink); border-left-color:var(--blue); background:#151E2B}
  .row .c{color:var(--faint); width:12px; flex:none}
  .row[aria-current="true"] .c{color:var(--blue-soft)}
  .row .n{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row .t{color:var(--faint); font-size:8.5px; letter-spacing:.1em}

  .stage{flex:1; min-width:0; position:relative; overflow:hidden; background:var(--ground)}
  svg{display:block; width:100%; height:100%; touch-action:none; cursor:grab}
  svg.dragging{cursor:grabbing}
  .node-hit{cursor:pointer}

  .flow-dot{cursor:pointer}

  .origin{border:1px dashed var(--region); padding:8px 10px; margin:0 0 18px}

  .hints{
    border-top:1px solid var(--rule); background:var(--panel);
    padding:6px 14px; color:var(--faint);

  }
  @media (prefers-reduced-motion:reduce){ .flow-dot{display:none} }
</style>

const REGIONS = [
{label:"外部服务",of:["provider","speech"],note:"虚线表示仓库外的模型与在线语音服务。图中本地适配器路径可在“代码与接口”查看。Whisper、React、three.js 等第三方库在本地模块中使用，未逐一拆成节点。"}
];

/* ------------------------------------------------------------- geometry */

const SX = 78, SY = 39, W = 32, H = 16;
const at = n => ({ x:(n.gx - n.gy) * SX, y:(n.gx + n.gy) * SY });
const byId = Object.fromEntries(NODES.map(n => [n.id, n]));

const NS = "http://www.w3.org/2000/svg";
const make = (t, a={}) => { const e = document.createElementNS(NS, t);
  for (const k in a) e.setAttribute(k, a[k]); return e; };

/* ---------------------------------------------------------------- build */

const gRegions = document.getElementById("regions");
const gEdges = document.getElementById("edges");
const gDots  = document.getElementById("dots");
const gNodes = document.getElementById("nodes");
const gLabels = document.getElementById("labels");

// The outline is a rectangle in grid space, which the projection turns into a
// diamond lying on the floor — the same plane the grid pattern is drawn on, so
// it reads as ground rather than as a box floating in front of the blocks.
// Blocks stand up out of it and are painted over it, which is the point: the
// region says where a thing sits, not what covers it.
const REGION_PAD = 0.62;   // grid units, ~48px across at this scale
const regionPts = [];      // hull corners, so fit() can see them

// The blocks inside a region are drawn dashed too, so a single cube still
// reads as "not ours" once the reader has panned away from the outline or
// zoomed past it. The outline says where the boundary is; the dashes say
// which blocks it is about.
const inRegion = new Set(REGIONS.flatMap(r => r.of));
const REGION_DASH = "3.5 2.5";

const regionEls = [];
for (const r of REGIONS) {
  const members = r.of.map(id => byId[id]).filter(Boolean);
  if (!members.length) continue;   // verify.py catches the typo that gets here

  const gx0 = Math.min(...members.map(n => n.gx)) - REGION_PAD;
  const gx1 = Math.max(...members.map(n => n.gx)) + REGION_PAD;
  const gy0 = Math.min(...members.map(n => n.gy)) - REGION_PAD;
  const gy1 = Math.max(...members.map(n => n.gy)) + REGION_PAD;
  const corner = (gx, gy) => ({ x:(gx - gy) * SX, y:(gx + gy) * SY });
  const pts = [corner(gx0, gy0), corner(gx1, gy0), corner(gx1, gy1), corner(gx0, gy1)];
  regionPts.push(...pts);

  const poly = make("polygon", {
    points:pts.map(p => `${p.x},${p.y}`).join(" "), fill:"none",
    stroke:"var(--region)", "stroke-width":1, "stroke-dasharray":"5 4",
  });
  gRegions.appendChild(poly);

  // Under the south corner, centred — the same place, and for the same
  // reason, as a node's own name. Blocks stand up and away from the viewer,
  // so the strip below the front corner is the one part of the drawing
  // nothing else ever occupies. Above the region reads better on an empty
  // grid and collides with the neighbours on a full one.
  // One short line only. `note` deliberately does not appear here: a second
  // line doubles the width the caption has to find room for, and on a full
  // grid there is no direction with room for it. It goes in the panel, which
  // is where a reader is already looking for detail.
  const south = pts[2];
  const label = make("text", { x:south.x, y:south.y + 15, "text-anchor":"middle",
    "font-family":"var(--mono)", "font-size":"9", "letter-spacing":".16em",
    fill:"var(--region-ink)" });
  label.textContent = r.label.toUpperCase();
  gLabels.appendChild(label);
  regionPts.push({ x:south.x, y:south.y + 21 });

  regionEls.push({ poly, label, ids:new Set(r.of) });
}

// Back to front, so nearer blocks overlap further ones.
const order = [...NODES].sort((a,b) => (a.gx + a.gy) - (b.gx + b.gy));

const edgePaths = EDGES.map(([from, to, datum, whence]) => {
  const a = at(byId[from]), b = at(byId[to]);
  const mid = { x:(a.x + b.x) / 2, y:(a.y + b.y) / 2 - 26 };
  const d = `M${a.x} ${a.y} Q${mid.x} ${mid.y} ${b.x} ${b.y}`;
  const p = make("path", { d, fill:"none", stroke:"#26303D", "stroke-width":1 });
  gEdges.appendChild(p);
  return { p, from, to, datum, whence, len:0 };
});
edgePaths.forEach(e => { e.len = e.p.getTotalLength(); });

const nodeEls = {};
for (const n of order) {
  const { x, y } = at(n);
  const g = make("g", { transform:`translate(${x} ${y})`, class:"node-hit",
                        tabindex:"0", role:"button", "aria-label":n.name });

  // A node with `stack` is drawn as that many plates sharing the block's total
  // height, rather than as one solid mass. The two encodings compose: height
  // still says how much logic is here, and the plate count says how many
  // things of one kind it is. Splitting the height rather than adding to it is
  // what keeps them from fighting — a stack of five never outweighs a taller
  // neighbour just for being subdivided.
  const plates = n.stack || 1;
  const gap = plates > 1 ? 2.5 : 0;
  const thick = (n.h - gap * (plates - 1)) / plates;

  const fTs = [], fLs = [], fRs = [];
  for (let i = 0; i < plates; i++) {
    const b = i * (thick + gap);   // this plate's underside
    const u = b + thick;           // and its top
    const top   = `${-W},${-u} 0,${-H - u} ${W},${-u} 0,${H - u}`;
    const left  = `${-W},${-u} 0,${H - u} 0,${H - b} ${-W},${-b}`;
    const right = `${W},${-u} 0,${H - u} 0,${H - b} ${W},${-b}`;

    const fL = make("polygon", { points:left,  fill:"var(--face-left)",  stroke:"#2B3644", "stroke-width":1 });
    const fR = make("polygon", { points:right, fill:"var(--face-right)", stroke:"#2B3644", "stroke-width":1 });
    const fT = make("polygon", { points:top,   fill:"var(--face-top)",   stroke:"#3A4859", "stroke-width":1 });
    // Bottom plate first, so each one paints over the one beneath it.
    g.append(fL, fR, fT);
    fLs.push(fL); fRs.push(fR); fTs.push(fT);
  }

  // Dashed edges for a block inside a region. Only the outline changes —
  // the faces keep their fills, so the block still reads as solid mass on
  // the grid rather than as a ghost or a thing that is switched off.
  if (inRegion.has(n.id)) {
    for (const f of [...fLs, ...fRs, ...fTs]) f.setAttribute("stroke-dasharray", REGION_DASH);
  }

  const code = make("text", { x:0, y:-n.h + 4, "text-anchor":"middle",
    "font-family":"var(--mono)", "font-size":"11", fill:"#8FA0B5" });
  code.textContent = n.c;
  g.appendChild(code);

  // Into the label layer at absolute position, not into this node's group:
  // blocks are drawn back to front, so a nearer block would otherwise cover
  // the name of the one behind it. Rendering the page is the only way this
  // shows up — it looks like a truncated string, not a z-order problem.
  const label = make("text", { x:x, y:y + H + 15, "text-anchor":"middle",
    "font-family":"var(--mono)", "font-size":"10.5", fill:"#8894A6" });
  label.textContent = n.name;
  gLabels.appendChild(label);

  g.addEventListener("click", () => select(n.id));
  g.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(n.id); }
  });
  gNodes.appendChild(g);
  nodeEls[n.id] = { g, fTs, fLs, fRs, label, code };
}

/* ------------------------------------------------------------- the flow */

const dots = edgePaths.flatMap((e, i) =>
  [0, 0.5].map(offset => {
    const c = make("circle", { r:3, fill:"var(--orange)", class:"flow-dot" });
    c.addEventListener("click", ev => { ev.stopPropagation(); inspect(e); });
    gDots.appendChild(c);
    return { e, t:(i * 0.11 + offset) % 1, c };
  })
);

let running = true, last = performance.now();
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function advance(dt) {
  for (const d of dots) {
    d.t = (d.t + dt * 0.055) % 1;
    const pt = d.e.p.getPointAtLength(d.t * d.e.len);
    d.c.setAttribute("cx", pt.x);
    d.c.setAttribute("cy", pt.y);
    // Brightest at the middle of the run, so the direction of travel reads.
    d.c.setAttribute("opacity", (0.25 + 0.75 * Math.sin(Math.PI * d.t)).toFixed(3));
  }
}
advance(0);

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (running && !reduced) advance(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ------------------------------------------------------------ pan, zoom */

const svg = document.getElementById("svg");
const world = document.getElementById("world");
let view = { x:0, y:0, k:1 }, home = null;

function apply() {
  world.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`);
}
function fit() {
  const r = svg.getBoundingClientRect();
  // Region outlines reach further than the blocks they hold, so their corners
  // go in here too — otherwise a region on the edge of the graph is cut off by
  // the panel and looks like a line that stops for no reason.
  const pts = NODES.map(at).concat(regionPts);

  // Blocks stand up out of their anchor, so the top of the tallest one is the
  // real upper edge of the drawing, not the anchor row.
  for (const n of NODES) {
    const p = at(n);
    pts.push({ x:p.x, y:p.y - n.h - H });
  }

  // Measure the labels rather than reserving a guessed margin for them. This
  // used to be a flat 140 across and 120 down, tuned by hand against one
  // example: labels overhang a block by roughly 60 a side, so 140 cleared the
  // worst of them. But it is wrong in both directions — too tight for a map
  // with long names, and on this one it wasted about a tenth of the available
  // scale on space nothing occupied. getBBox gives the true extent, so the
  // margin left over is a real margin instead of a fudge factor.
  let measured = true;
  try {
    const texts = [...Object.values(nodeEls).map(e => e.label),
                   ...regionEls.map(e => e.label)];
    for (const t of texts) {
      const b = t.getBBox();
      // A zero-width box means the text has not been laid out. Some engines
      // return that instead of throwing, and taking it at face value drags
      // every bound toward the origin — which on a graph that does not
      // contain the origin silently zooms the whole map out.
      if (!b.width) { measured = false; break; }
      pts.push({ x:b.x, y:b.y }, { x:b.x + b.width, y:b.y + b.height });
    }
  } catch (_) {
    measured = false;   // no layout yet — fall back to the old constants
  }

  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const pad = measured ? 28 : 140;
  const w = Math.max(...xs) - Math.min(...xs) + pad;
  const h = Math.max(...ys) - Math.min(...ys) + (measured ? 28 : 120);
  // The cap stops a three-node graph filling the screen with enormous blocks.
  // It was 1.15, which left the default view marooned in the middle of a wide
  // window, then 1.7, which this 16-node example ran straight into — it could
  // take 1.85 before the width bound it. 2.2 leaves the binding edge to the
  // geometry in every case seen so far.
  view.k = Math.min(r.width / w, r.height / h, 2.2);
  view.x = r.width / 2 - ((Math.min(...xs) + Math.max(...xs)) / 2) * view.k;
  view.y = r.height / 2 - ((Math.min(...ys) + Math.max(...ys)) / 2) * view.k;
  home = { ...view };
  apply();
}

let drag = null;
svg.addEventListener("pointerdown", e => {
  drag = { x:e.clientX, y:e.clientY, vx:view.x, vy:view.y };
  svg.classList.add("dragging");
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", e => {
  if (!drag) return;
  view.x = drag.vx + (e.clientX - drag.x);
  view.y = drag.vy + (e.clientY - drag.y);
  apply();
});
svg.addEventListener("pointerup", e => {
  drag = null; svg.classList.remove("dragging");
  try { svg.releasePointerCapture(e.pointerId); } catch (_) {}
});
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.max(0.35, Math.min(2.4, view.k * (e.deltaY < 0 ? 1.08 : 0.926)));
  view.x = mx - (mx - view.x) * (k / view.k);
  view.y = my - (my - view.y) * (k / view.k);
  view.k = k;
  apply();
}, { passive:false });

/* ------------------------------------------------------------- chrome */

const statsEl = document.getElementById("stats");
for (const [k, v, lead] of STATS) {
  const d = document.createElement("div");
  d.className = "stat" + (lead ? " lead" : "");
  d.innerHTML = `<div class="k"></div><div class="v"></div>`;
  d.querySelector(".k").textContent = k;
  d.querySelector(".v").textContent = v;
  statsEl.appendChild(d);
}
const ctl = document.createElement("div");
ctl.className = "controls";
ctl.innerHTML =
  `<button id="b-flow" aria-pressed="false">暂停数据流</button>` +
  `<button id="b-step">前进一步</button>` +
  `<button id="b-reset">重置视图</button>`;
statsEl.appendChild(ctl);

document.getElementById("b-flow").addEventListener("click", e => {
  running = !running;
  e.currentTarget.textContent = running ? "暂停数据流" : "继续数据流";
  e.currentTarget.setAttribute("aria-pressed", String(!running));
});
document.getElementById("b-step").addEventListener("click", () => advance(0.5));
document.getElementById("b-reset").addEventListener("click", () => { view = { ...home }; apply(); });

const indexEl = document.getElementById("index");
let lastGrp = null;
for (const n of NODES) {
  if (n.grp !== lastGrp) {
    const h = document.createElement("div");
    h.className = "grp"; h.textContent = n.grp;
    indexEl.appendChild(h); lastGrp = n.grp;
  }
  const b = document.createElement("button");
  b.className = "row"; b.id = "row-" + n.id;
  b.innerHTML = `<span class="c"></span><span class="n"></span><span class="t"></span>`;
  b.querySelector(".c").textContent = n.c;
  b.querySelector(".n").textContent = n.name;
  b.querySelector(".t").textContent = EDGES.filter(e => e[0] === n.id || e[1] === n.id).length;
  b.addEventListener("click", () => select(n.id));
  indexEl.appendChild(b);
}

/* ------------------------------------------------------------ the panel */

const readEl = document.getElementById("read");
const tabDoes = document.getElementById("tab-does");
const tabBuilt = document.getElementById("tab-built");
// The first node, not a hard-coded id. Naming one here meant every map
// built from this template opened with an empty panel until its author
// noticed, because byId[<id from another project>] is undefined and
// render() throws before it draws anything.
let current = NODES[0].id, tab = "does";

tabDoes.addEventListener("click", () => { tab = "does"; render(); });
tabBuilt.addEventListener("click", () => { tab = "built"; render(); });

function select(id) { current = id; render(); }

function highlight() {
  for (const n of NODES) {
    const el = nodeEls[n.id], on = n.id === current;
    // Every plate, not just the top one — a stacked node half-lit reads as a
    // rendering fault rather than as a selection.
    for (const f of el.fTs) {
      f.setAttribute("fill", on ? "#1E4E82" : "var(--face-top)");
      f.setAttribute("stroke", on ? "var(--blue)" : "#3A4859");
    }
    for (const f of el.fLs) f.setAttribute("fill", on ? "#14314F" : "var(--face-left)");
    for (const f of el.fRs) f.setAttribute("fill", on ? "#0F2439" : "var(--face-right)");
    el.label.setAttribute("fill", on ? "#BFD3EA" : "#8894A6");
    el.code.setAttribute("fill", on ? "#9EC4EE" : "#8FA0B5");
    const row = document.getElementById("row-" + n.id);
    if (row) row.setAttribute("aria-current", String(on));
  }
  for (const e of edgePaths) {
    const on = e.from === current || e.to === current;
    e.p.setAttribute("stroke", on ? "var(--blue)" : "#26303D");
    e.p.setAttribute("stroke-width", on ? 1.6 : 1);
  }
  for (const r of regionEls) {
    const on = r.ids.has(current);
    r.poly.setAttribute("stroke", on ? "var(--region-on)" : "var(--region)");
    r.label.setAttribute("fill", on ? "var(--region-ink-on)" : "var(--region-ink)");
  }
  for (const d of dots) {
    const on = d.e.from === current || d.e.to === current;
    d.c.setAttribute("fill", on ? "var(--orange)" : "#7A5334");
    d.c.setAttribute("r", on ? 3.6 : 2.6);
  }
}

function render() {
  const n = byId[current];
  tabDoes.setAttribute("aria-selected", String(tab === "does"));
  tabBuilt.setAttribute("aria-selected", String(tab === "built"));

  const facts = (n.facts || []).map(([k, v]) =>
    `<dt>${k}</dt><dd>${v}</dd>`).join("");

  // Whose code this is, if it is not yours. Shown on both tabs: it is a fact
  // about the component, not about how it was built.
  const region = REGIONS.find(r => r.of.includes(n.id));
  const origin = region
    ? `<div class="origin"><span class="who">${esc(region.label)}</span>` +
      (region.note ? `<span class="what">${esc(region.note)}</span>` : "") + `</div>`
    : "";

  readEl.innerHTML =
    `<p class="eyebrow">${n.grp}</p>` +
    `<h2>${n.name}</h2>` +
    `<p class="sub">${n.sub}</p>` + origin +
    (tab === "does"
      ? `<h3>职责与边界</h3><p>${n.does}</p>` +
        (facts ? `<h3>代码事实 / 历史观测</h3><dl class="facts">${facts}</dl>` : "")
      : `<h3>代码与接口</h3><p>${n.built}</p>` +
        `<h3>流入与流出</h3>` +
        EDGES.filter(e => e[0] === n.id).map(e =>
          `<p class="quiet">→ ${byId[e[1]].name} · <code>${esc(e[2])}</code></p>`).join("") +
        EDGES.filter(e => e[1] === n.id).map(e =>
          `<p class="quiet">← ${byId[e[0]].name} · <code>${esc(e[2])}</code></p>`).join(""));

  highlight();
}

function esc(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
}

function inspect(e) {
  readEl.innerHTML =
    `<p class="eyebrow">流动中的数据</p>` +
    `<h2>${byId[e.from].name} → ${byId[e.to].name}</h2>` +
    `<p class="sub">该逻辑关系上传递的值或协议摘录</p>` +
    `<div class="snippet">` +
      `<div class="lbl">数据片段</div>` +
      `<div class="val">${esc(e.datum)}</div>` +
      `<div class="whence">${e.whence}</div>` +
    `</div>` +
    `<p class="quiet">片段来自当前源码、协议注释或合成测试夹具，来源逐条注明。连线是逻辑依赖与数据流，可折叠 API/适配器，不表示所有模块直接网络连接。默认值不代表已部署配置；历史观测未在本次重跑。</p>`;
}

document.addEventListener("keydown", e => {
  if (e.code === "Space" && e.target === document.body) {
    e.preventDefault();
    document.getElementById("b-flow").click();
  }
});

addEventListener("resize", fit);
fit();
render();
</script>

</html>
