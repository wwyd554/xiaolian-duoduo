name: Check PR Target Branch

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  check-target-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify PR target branch
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "PR #$PR_NUMBER: $PR_TITLE"
          echo "Target branch: $BASE_BRANCH"
          echo "Source branch: $HEAD_BRANCH"
          
          # 检查特殊的 PR 模式（发布、热修复等）
          if [[ "$PR_TITLE" =~ ^(Release:|Hotfix:|RELEASE:|HOTFIX:) ]]; then
            echo "该 PR 属于发布或热修复，因此允许以 main 为目标分支"
            exit 0
          fi
          
          # 目标分支不是 dev 时发出警告
          if [[ "$BASE_BRANCH" != "dev" ]]; then
            echo "::warning::⚠️ 该 PR #$PR_NUMBER 的目标分支被设置为 '$BASE_BRANCH'。"
            echo "::warning::除非有特殊理由，PR 的目标分支应为 'dev'。"
            echo "::warning::请确认 PR 创建者是否有意选择了该目标分支。"
            
            # 使用 GitHub API 向 PR 添加评论
            COMMENT="⚠️ **警告: 目标分支确认**\n\n该 PR 的目标分支被设置为 \`$BASE_BRANCH\`。\n\n除非有特殊理由（发布或热修复等），PR 的目标分支应为 \`dev\`。如果是有意选择的，请忽略本提醒；否则请考虑修改 PR 的目标分支。"
            
            curl -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -d "{\"body\":\"$COMMENT\"}"
            
            # 作为警告而非错误处理
            # exit 1
          else
            echo "✅ 目标分支已正确设置为 'dev'"
          fi